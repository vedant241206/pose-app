name: pose_camera
description: A production-ready, native-style Camera Application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  gal: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  permission_handler: ^11.3.0
  google_mlkit_pose_detection: ^0.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pose_templates.json
